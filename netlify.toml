[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_API_URL,NEXT_PUBLIC_GOOGLE_MAPS_API_KEY,INTERNAL_API_URL,BACKEND_INTERNAL_URL"
  SECRETS_SCAN_OMIT_PATHS = ".next/**,.netlify/**"
